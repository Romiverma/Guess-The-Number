
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guess the Number JavaScript Game">
    <title>Guess The Number | Number Game</title>

    <link rel="stylesheet" href="Project 3.css">
</head>
<body>

    <main class="game-container">

        <div class="game-card">

            <!-- Header -->
            <header class="header">
                <div class="game-icon">🎯</div>
                <h1>Guess The Number</h1>
                <p>Test your luck and challenge your brain!</p>
            </header>

            <!-- Game Instructions -->
            <section class="instructions">
                <span class="info-icon">💡</span>
                <p>
                    I'm thinking of a number between
                    <strong>1 and 100</strong>.
                    Can you guess it?
                </p>
            </section>

            <!-- Number Display -->
            <section class="number-section">
                <span class="section-label">YOUR CHALLENGE</span>
                <div class="question-mark">?</div>
                <p>Find the secret number</p>
            </section>

            <!-- Input Area -->
            <section class="input-section">

                <label for="guessInput">Enter your guess</label>

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter a number (1-100)"
                    min="1"
                    max="100"
                >

                <button id="checkBtn" class="check-btn">
                    Check My Guess <span>→</span>
                </button>

            </section>

            <!-- Feedback Message -->
            <section class="feedback" id="feedback">
                <span class="feedback-icon">🎮</span>
                <p id="message">Your adventure starts here!</p>
            </section>

            <!-- Statistics -->
            <section class="stats">

                <div class="stat-box">
                    <span class="stat-icon">🔢</span>
                    <h2 id="attempts">0</h2>
                    <p>Attempts</p>
                </div>

                <div class="stat-box">
                    <span class="stat-icon">🏆</span>
                    <h2 id="bestScore">--</h2>
                    <p>Best Score</p>
                </div>

            </section>

            <!-- Reset Button -->
            <button id="resetBtn" class="reset-btn">
                ↻ &nbsp; Start New Game
            </button>

            <!-- Footer -->
            <footer>
                Made with ❤️ for JavaScript practice
            </footer>

        </div>

    </main>

    <script src="Project 3.js"></script>

</body>
</html>
